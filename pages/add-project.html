<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>إضافة مشروع | MINA Programmer</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=Orbitron:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../css/main.css">
    <link rel="stylesheet" href="../css/components/navbar.css">
    <link rel="stylesheet" href="../css/components/buttons.css">
    <link rel="stylesheet" href="../css/components/forms.css">
    <link rel="stylesheet" href="../css/themes/neon-theme.css">
    
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-storage-compat.js"></script>
</head>
<body>

    <div id="navbar-container"></div>
    
    <main>
        <div class="container">
            <div class="form-container" style="margin: 100px auto; max-width: 800px;">
                <h1 class="form-title">إضافة <span class="gradient-highlight">مشروع جديد</span></h1>
                
                <form id="add-project-form">
                    <div class="form-group">
                        <div class="input-field">
                            <input type="text" id="project-title" required>
                            <label>عنوان المشروع</label>
                            <div class="input-line"></div>
                        </div>
                    </div>
                    
                    <div class="form-group">
                        <div class="input-field">
                            <textarea id="project-description" rows="5" required></textarea>
                            <label>وصف المشروع</label>
                            <div class="input-line"></div>
                        </div>
                    </div>
                    
                    <div class="form-row">
                        <div class="form-group">
                            <div class="input-field">
                                <input type="text" id="project-techs" placeholder="React, Node.js, MongoDB">
                                <label>التقنيات (مفصولة بفواصل)</label>
                                <div class="input-line"></div>
                            </div>
                        </div>
                        
                        <div class="form-group">
                            <div class="input-field">
                                <select id="project-category">
                                    <option value="web">تطوير ويب</option>
                                    <option value="mobile">تطبيقات جوال</option>
                                    <option value="security">أمن سيبراني</option>
                                    <option value="ai">ذكاء اصطناعي</option>
                                </select>
                                <label>التصنيف</label>
                                <div class="input-line"></div>
                            </div>
                        </div>
                    </div>
                    
                    <div class="form-row">
                        <div class="form-group">
                            <div class="input-field">
                                <input type="url" id="project-image" placeholder="https://example.com/image.jpg">
                                <label>رابط الصورة</label>
                                <div class="input-line"></div>
                            </div>
                        </div>
                        
                        <div class="form-group">
                            <div class="input-field">
                                <input type="url" id="project-demo" placeholder="https://example.com/demo">
                                <label>رابط المعاينة الحية</label>
                                <div class="input-line"></div>
                            </div>
                        </div>
                    </div>
                    
                    <div class="form-group">
                        <div class="input-field">
                            <input type="url" id="project-github" placeholder="https://github.com/username/repo">
                            <label>رابط GitHub</label>
                            <div class="input-line"></div>
                        </div>
                    </div>
                    
                    <button type="submit" class="btn-submit">
                        <i class="fas fa-cloud-upload-alt"></i>
                        <span>نشر المشروع</span>
                    </button>
                </form>
            </div>
        </div>
    </main>
    
    <div id="footer-container"></div>
    <div id="toast-container"></div>

    <script src="../js/config/constants.js"></script>
    <script src="../js/config/firebase-config.js"></script>
    <script src="../js/utils/helpers.js"></script>
    <script src="../js/utils/validators.js"></script>
    <script src="../js/components/toast.js"></script>
    <script src="../js/components/loader.js"></script>
    <script src="../js/components/navbar.js"></script>
    <script src="../js/services/auth-service.js"></script>
    <script src="../js/services/projects-service.js"></script>
    <script src="../js/services/storage-service.js"></script>
    <script src="../js/pages/add-project.js"></script>
    <script src="../js/app.js"></script>
</body>
</html>
