<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تسجيل الدخول | MINA Programmer</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=Orbitron:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../css/main.css">
    <link rel="stylesheet" href="../css/components/buttons.css">
    <link rel="stylesheet" href="../css/components/forms.css">
    <link rel="stylesheet" href="../css/pages/auth.css">
    <link rel="stylesheet" href="../css/themes/neon-theme.css">
    
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
</head>
<body>

    <div class="auth-container">
        <div class="auth-card">
            <div class="auth-logo">
                <div class="logo-icon">◆</div>
                <h2>MINA<span class="gradient-highlight">.DEV</span></h2>
            </div>
            
            <!-- Login Form -->
            <div id="login-form-container">
                <div class="auth-title">
                    <h3>تسجيل الدخول</h3>
                    <p>مرحباً بعودتك</p>
                </div>
                
                <div id="login-error" class="auth-error" style="display: none;"></div>
                
                <button id="google-login" class="google-btn">
                    <i class="fab fa-google"></i>
                    <span>الدخول بحساب جوجل</span>
                </button>
                
                <div class="divider">
                    <span>أو</span>
                </div>
                
                <form id="login-form">
                    <div class="input-field">
                        <input type="email" id="login-email" required>
                        <label>البريد الإلكتروني</label>
                        <div class="input-line"></div>
                    </div>
                    <div class="input-field">
                        <input type="password" id="login-password" required>
                        <label>كلمة المرور</label>
                        <div class="input-line"></div>
                    </div>
                    <button type="submit" class="btn-submit">تسجيل الدخول</button>
                </form>
                
                <div class="auth-footer">
                    ليس لديك حساب؟ <a href="#" id="show-register">إنشاء حساب جديد</a>
                </div>
            </div>
            
            <!-- Register Form -->
            <div id="register-form-container" style="display: none;">
                <div class="auth-title">
                    <h3>إنشاء حساب</h3>
                    <p>انضم إلينا الآن</p>
                </div>
                
                <div id="register-error" class="auth-error" style="display: none;"></div>
                
                <form id="register-form">
                    <div class="input-field">
                        <input type="text" id="reg-name" required>
                        <label>الاسم الكامل</label>
                        <div class="input-line"></div>
                    </div>
                    <div class="input-field">
                        <input type="email" id="reg-email" required>
                        <label>البريد الإلكتروني</label>
                        <div class="input-line"></div>
                    </div>
                    <div class="input-field">
                        <input type="password" id="reg-password" required>
                        <label>كلمة المرور</label>
                        <div class="input-line"></div>
                    </div>
                    <div class="input-field">
                        <input type="password" id="reg-confirm" required>
                        <label>تأكيد كلمة المرور</label>
                        <div class="input-line"></div>
                    </div>
                    <button type="submit" class="btn-submit">إنشاء حساب</button>
                </form>
                
                <div class="auth-footer">
                    لديك حساب بالفعل؟ <a href="#" id="show-login">تسجيل الدخول</a>
                </div>
            </div>
        </div>
    </div>
    
    <div id="toast-container"></div>

    <script src="../js/config/constants.js"></script>
    <script src="../js/config/firebase-config.js"></script>
    <script src="../js/components/toast.js"></script>
    <script src="../js/pages/login.js"></script>
</body>
</html>
